<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="De officiële Mikis13-website voor muziek, software en digitale projecten."
    >

    <title>Mikis13</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <main class="min-h-screen flex items-center justify-center px-6 py-16">

        <section
            class="w-full max-w-5xl rounded-3xl border
                   border-white/10 bg-white/5 p-8
                   shadow-2xl backdrop-blur md:p-14"
        >

            <div
                class="inline-flex rounded-full border
                       border-blue-400/30 bg-blue-500/10
                       px-4 py-2 text-sm text-blue-200"
            >
                Officiële Mikis13-website
            </div>

            <h1
                class="mt-7 text-5xl font-black
                       tracking-tight md:text-7xl"
            >
                Mikis13
            </h1>

            <p
                class="mt-5 max-w-2xl text-lg
                       leading-8 text-slate-300"
            >
                Muziek, software, creatieve projecten
                en nieuwe digitale ideeën.
            </p>

            <div class="mt-9 flex flex-wrap gap-4">

                <a
                    href="https://github.com/Ice1984m"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="rounded-xl bg-blue-600 px-6 py-3
                           font-semibold transition
                           hover:bg-blue-500"
                >
                    GitHub openen
                </a>

                <button
                    id="status-button"
                    type="button"
                    class="rounded-xl border border-white/20
                           px-6 py-3 font-semibold transition
                           hover:bg-white/10"
                >
                    Website testen
                </button>

            </div>

            <p
                id="status"
                class="mt-6 text-sm text-emerald-300"
            >
                Website is geladen.
            </p>

            <div
                class="mt-10 grid gap-4
                       sm:grid-cols-2 lg:grid-cols-3"
            >

                <article
                    class="rounded-2xl border border-white/10
                           bg-black/20 p-5"
                >
                    <h2 class="font-bold">Muziek</h2>
                    <p class="mt-2 text-sm text-slate-400">
                        Releases en creatieve producties.
                    </p>
                </article>

                <article
                    class="rounded-2xl border border-white/10
                           bg-black/20 p-5"
                >
                    <h2 class="font-bold">Software</h2>
                    <p class="mt-2 text-sm text-slate-400">
                        Apps, websites en GitHub-projecten.
                    </p>
                </article>

                <article
                    class="rounded-2xl border border-white/10
                           bg-black/20 p-5"
                >
                    <h2 class="font-bold">Mikis13 AI</h2>
                    <p class="mt-2 text-sm text-slate-400">
                        Nieuwe AI-functies worden toegevoegd.
                    </p>
                </article>

            </div>

        </section>

    </main>

    <script>
        const button =
            document.getElementById("status-button");

        const status =
            document.getElementById("status");

        button.addEventListener("click", () => {
            status.textContent =
                "Alles werkt correct via GitHub Pages.";
        });
    </script>

</body>
</html>
