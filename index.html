<!doctype html>
<html lang="nl">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Mikis13 Shop</title>

<link
rel="stylesheet"
href="assets/css/style.css">

<script src="assets/js/legal-runtime.js"></script>
</head>

<body>

<header>

<div class="wrap">

<nav>

<div class="brand">
MIKIS<span>13</span> SHOP
</div>

<div>

<a
class="btn"
href="checkout.html">
🛒 Winkelwagen
</a>

<a
class="btn"
href="admin.html">
Admin
</a>

</div>

</nav>

</div>

</header>

<main class="wrap">

<section class="hero">

<h1>
Mikis13<br>
Webshop
</h1>

<p>
50 geselecteerde startproducten
voor de Mikis13 dropshipping webshop.
</p>

</section>

<div class="controls">

<input
id="search"
placeholder="Zoeken...">

<select id="category">

<option value="">
Alle categorieën
</option>

</select>

</div>

<section
id="products"
class="grid">
</section>

</main>

<script>

let products=[];

let cart=
JSON.parse(
localStorage.getItem("cart")||"[]"
);

async function start(){

products=
await fetch("data/products.json")
.then(r=>r.json());

let cats=[
...new Set(products.map(p=>p.category))
];

category.innerHTML+=
cats.map(c=>
`<option>${c}</option>`
).join("");

render(products);

}

function render(list){

productsEl=
document.getElementById("products");

productsEl.innerHTML=
list.map(p=>`

<div class="card">

<img
src="${p.image}"
alt="${p.name}">

<div class="pad">

<small class="muted">
${p.category}
</small>

<h3>
${p.name}
</h3>

<div class="row">

<span class="price">
€${p.price.toFixed(2)}
</span>

<button
class="btn"
onclick="add(${p.id})">
Kopen
</button>

</div>

</div>

</div>

`).join("");

}

function add(id){

if(!window.MIKIS_COMMERCE_READY){
  alert(
    "Dit product is nog niet vrijgegeven voor verkoop. " +
    "De verplichte bedrijfs- en productcompliance wordt nog gecontroleerd."
  );
  return;
}


let product=
products.find(p=>p.id===id);

let existing=
cart.find(p=>p.id===id);

if(existing){
existing.qty++;
}else{
cart.push({...product,qty:1});
}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("Toegevoegd aan winkelwagen");

}

function filter(){

let q=
search.value.toLowerCase();

let c=
category.value;

render(
products.filter(
p=>
p.name.toLowerCase().includes(q)
&&
(!c||p.category===c)
)
);

}

search.oninput=filter;
category.onchange=filter;

start();

</script>
