services:
  - type: web
    runtime: static
    name: mikis13-site
    repo: https://github.com/Ice1984m/mikis13-site
    branch: main
    buildCommand: ""
    staticPublishPath: .
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
