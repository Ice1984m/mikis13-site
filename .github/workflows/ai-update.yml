name: AI website-update

on:
  workflow_dispatch:
    inputs:
      opdracht:
        description: "Beschrijf de gewenste wijziging"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Controleer API-sleutel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo "OPENAI_API_KEY ontbreekt bij repository secrets."
            exit 1
          }

      - name: Laat AI een nieuwe index.html maken
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPDRACHT: ${{ inputs.opdracht }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, sys

          current = pathlib.Path("index.html").read_text(encoding="utf-8")
          prompt = f"""Werk de onderstaande website bij.

          Opdracht:
          {os.environ['OPDRACHT']}

          Regels:
          - Geef uitsluitend de complete nieuwe index.html.
          - Gebruik geen markdown-codeblokken.
          - Begin direct met <!doctype html>.
          - Behoud een veilige statische website.
          - Voeg geen geheime sleutels toe.

          Huidige index.html:
          {current}
          """

          payload = json.dumps({
              "model": "gpt-4.1-mini",
              "messages": [
                  {"role": "user", "content": prompt}
              ]
          }).encode()

          request = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as e:
              print("API-fout:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              sys.exit(1)

          text = data["choices"][0]["message"]["content"].strip()

          # Verwijder eventuele markdown codeblokken
          import re
          text = re.sub(r"^```(?:html)?\s*", "", text)
          text = re.sub(r"\s*```$", "", text.strip())

          if not text.lower().startswith("<!doctype html"):
              raise SystemExit("AI-uitvoer is geen geldige complete HTML-pagina.")

          pathlib.Path("index.html").write_text(text + "\n", encoding="utf-8")
          print("KLAAR: nieuwe AI-site opgeslagen als index.html")
          PY

      - name: Maak automatisch een pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OPDRACHT: ${{ inputs.opdracht }}
        run: |
          BRANCH="ai-update-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add index.html
          git commit -m "AI website-update: $OPDRACHT"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "AI website-update: $OPDRACHT" \
            --body "Automatisch gegenereerde wijziging door AI. Controleer de voorbeeldweergave en merge daarna."
