name: Mikis13 Controlled Workers

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reden voor de controle
        required: true
        default: Handmatige Mikis13-controle
        type: string

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mikis13-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workers:
    name: Worker - ${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        role:
          - Scout
          - Analyse
          - Build
          - Test
          - Review

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7

      - name: Werkmap maken
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p worker-results

      - name: Worker uitvoeren
        shell: bash
        env:
          WORKER_ROLE: ${{ matrix.role }}
        run: |
          set -Eeuo pipefail

          REPORT="worker-results/${WORKER_ROLE}.md"

          {
            echo "# Worker: ${WORKER_ROLE}"
            echo
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_ID}"
            echo
          } > "$REPORT"

          case "$WORKER_ROLE" in
            Scout)
              {
                echo "## Inventaris"
                find . -maxdepth 3 -type f \
                  -not -path './.git/*' \
                  | sort \
                  | head -n 500
              } >> "$REPORT"
              ;;

            Analyse)
              {
                echo "## Beleidscontrole"

                for file in \
                  LICENSE \
                  NOTICE \
                  SECURITY.md \
                  CONTRIBUTING.md \
                  CODE_OF_CONDUCT.md \
                  AUTOMATION_POLICY.md
                do
                  if [ -s "$file" ]; then
                    echo "- AANWEZIG: $file"
                  else
                    echo "- ONTBREEKT: $file"
                  fi
                done

                echo
                echo "## Mogelijke geheimenbestanden"

                find . -maxdepth 5 -type f \
                  \( \
                    -name '.env' \
                    -o -name '*.pem' \
                    -o -name '*.key' \
                    -o -name 'id_rsa' \
                    -o -name 'id_ed25519' \
                  \) \
                  -not -path './.git/*' \
                  -print || true
              } >> "$REPORT"
              ;;

            Build)
              {
                echo "## Buildcontrole"

                if [ -x ./gradlew ]; then
                  echo "Gradle-project gevonden."
                  ./gradlew tasks --no-daemon
                elif [ -f package.json ]; then
                  echo "Node-project gevonden."
                  npm install --ignore-scripts
                  npm run build --if-present
                elif [ -f pyproject.toml ] ||
                     [ -f requirements.txt ]; then
                  echo "Python-project gevonden."
                  python -m compileall -q .
                else
                  echo "Geen ondersteund buildtype gevonden."
                fi
              } >> "$REPORT" 2>&1
              ;;

            Test)
              {
                echo "## Tests"

                if [ -x ./gradlew ]; then
                  ./gradlew test --no-daemon
                elif [ -f package.json ]; then
                  npm install --ignore-scripts
                  npm test --if-present
                elif [ -f pyproject.toml ] ||
                     [ -f requirements.txt ]; then
                  python -m compileall -q .

                  if python -c "import pytest" \
                    >/dev/null 2>&1
                  then
                    python -m pytest
                  else
                    echo "Pytest niet geïnstalleerd."
                    echo "Python-syntaxcontrole is uitgevoerd."
                  fi
                else
                  echo "Geen automatisch testtype gevonden."
                fi
              } >> "$REPORT" 2>&1
              ;;

            Review)
              {
                echo "## Review"
                echo "- Geen automatische push"
                echo "- Geen automatische merge"
                echo "- Geen automatische deployment"
                echo "- Geen betalingshandeling"
                echo "- Menselijke goedkeuring vereist"
              } >> "$REPORT"
              ;;

            *)
              echo "Onbekende workerrol." >> "$REPORT"
              exit 1
              ;;
          esac

      - name: Workerresultaat bewaren
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.role }}
          path: worker-results/
          retention-days: 30

  approval:
    name: Menselijke goedkeuring
    needs: workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Goedkeuring bevestigen
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Alle vijf gecontroleerde workers zijn voltooid."
          echo "De production-omgeving is menselijk goedgekeurd."
          echo "Er wordt niets automatisch gemerged of gedeployed."
